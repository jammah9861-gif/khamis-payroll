  :root{
    /* هوية أمانة عسير الرسمية — الألوان الأساسية والثانوية من دليل الهوية */
    --navy:#392015;    /* اللون الأساسي الغامق: "ثقة عززت الانتماء" */
    --navy-2:#4c2d1f;  /* درجة أفتح للـ hover */
    --gold:#a37956;    /* لون ثانوي: "قيم حافظت على الهوية" — يُستخدم كتمييز أساسي */
    --gold-2:#b89478;  /* درجة أفتح من الذهبي للـ hover */
    --bg:#f7f0e9;      /* أفتح درجات #D4AF91 — خلفية الصفحة */
    --card:#ffffff;
    --border:#e7d8c9;  /* درجة من #DDBFA7 */
    --text:#392015;    /* نفس اللون الأساسي الغامق */
    --muted:#8a7972;   /* درجة رمادية-بنية من دليل الهوية */
    --danger:#973d4b;  /* لون ثانوي: "تعاون جمع القلوب" — عنابي */
    --success:#007b69; /* لون ثانوي: "عراقة أضفت سحرها" — أخضر مزرق */
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,sans-serif;}
  .brand-font{font-family:'QuiverleafArabicCF','Tajawal',system-ui,sans-serif;}
  .num{font-family:'IBM Plex Mono',ui-monospace,monospace;direction:ltr;unicode-bidi:plaintext;}
  header.app{background:var(--navy);color:#fff;}
  .header-inner{max-width:1200px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-icon{height:44px;display:flex;align-items:center;flex-shrink:0;}
  .brand-icon img{height:100%;width:auto;object-fit:contain;}
  .brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px;}
  .brand p{font-size:11px;margin:2px 0 0;color:#d7c3b3;}
  select, input, button{font-family:inherit;}
  .muni-select{appearance:none;background:var(--navy-2);border:1px solid #6b4a37;color:#fff;font-size:13px;border-radius:8px;padding:9px 32px 9px 12px;min-width:170px;}
  .select-wrap{position:relative;}
  .select-wrap svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);pointer-events:none;color:#d7c3b3;}
  .btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;border-radius:8px;padding:8px 12px;border:1px solid transparent;cursor:pointer;transition:.15s;white-space:nowrap;}
  .btn-gold{background:var(--gold);color:#fff;font-weight:700;}
  .btn-gold:hover{background:var(--navy);}
  .btn-navy{background:var(--navy);color:#fff;font-weight:700;}
  .btn-navy:hover{background:var(--navy-2);}
  .btn-outline{background:#fff;border-color:var(--border);color:#5a4a41;}
  .btn-outline:hover{background:#faf4ee;}
  main{max-width:1200px;margin:0 auto;padding:24px 20px;}
  .empty{text-align:center;padding:80px 20px;color:var(--muted);}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal h3{margin:0 0 12px;font-size:15px;}
  .modal input{width:100%;border:1px solid #d9d6cb;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}
  .tabs{display:flex;background:#fff;border:1px solid var(--border);border-radius:10px;padding:4px;width:fit-content;}
  .tab{padding:8px 16px;font-size:13px;font-weight:700;border-radius:7px;border:none;background:transparent;color:var(--muted);cursor:pointer;}
  .tab.active{background:var(--navy);color:#fff;}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;}
  .toolbar-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .save-status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-left:4px;}
  .banner{display:flex;align-items:flex-start;gap:8px;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px;}
  .banner-warn{background:#fdf3e0;border:1px solid #f0d599;color:#8a6816;}
  .banner-err{background:#fcebeb;border:1px solid #f0b8b8;color:#9c2b2b;}
  .banner button{background:none;border:none;cursor:pointer;color:inherit;margin-right:auto;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:20px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden;}
  .card .cadre-tag{position:absolute;top:0;left:0;background:var(--gold);color:#fff;font-size:10px;padding:3px 9px;border-radius:0 0 8px 0;font-family:'IBM Plex Mono',monospace;}
  .card .label{font-size:11px;color:var(--muted);margin:8px 0 4px;}
  .card .count{font-size:24px;font-weight:700;color:var(--navy);}
  .card .unit{font-size:11px;color:var(--muted);margin-bottom:8px;}
  .card .net-row{display:flex;justify-content:space-between;font-size:12px;border-top:1px solid #eee;padding-top:8px;}
  .card .net-row .val{font-weight:700;color:#333;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  .table-wrap{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:auto;}
  thead tr{background:#faf9f5;color:var(--muted);}
  th{padding:11px 10px;font-weight:700;font-size:11px;text-align:center;white-space:nowrap;}
  th:first-child{text-align:right;}
  td{padding:6px 8px;text-align:center;border-top:1px solid #f1efe8;}
  tbody tr:hover{background:#faf9f5;}
  .sticky-col{position:sticky;right:0;background:#fff;}
  tbody tr:hover .sticky-col{background:#faf9f5;}
  .cell-input{width:76px;border:1px solid #dedad0;border-radius:6px;padding:5px 6px;font-size:12px;text-align:center;}
  .cell-select{width:100%;border:1px solid #dedad0;border-radius:6px;padding:5px 6px;font-size:12px;min-width:130px;}
  .del-btn{background:none;border:none;cursor:pointer;color:#c9b6a8;}
  .del-btn:hover{color:var(--danger);}
  .grand{border-top:2px solid var(--navy);background:#eef6f4;font-weight:700;}
  .grand td:first-child{color:var(--navy);}
  .section-title{font-size:14px;font-weight:700;color:var(--navy);margin:26px 0 10px;}
  .accordion{display:flex;flex-direction:column;gap:8px;}
  .acc-item{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .acc-header{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:none;cursor:pointer;text-align:right;font-family:inherit;}
  .acc-header:hover{background:#faf9f5;}
  .acc-chevron{transition:transform .15s;color:var(--muted);flex-shrink:0;}
  .acc-chevron.open{transform:rotate(180deg);}
  .acc-title{font-weight:700;font-size:13px;flex:1;}
  .acc-cadre{font-size:11px;color:var(--navy);background:#f3e6da;padding:2px 8px;border-radius:5px;}
  .acc-mini{font-size:12px;color:var(--muted);white-space:nowrap;}
  .acc-body{border-top:1px solid var(--border);padding:6px 14px 14px;}
  .acc-table{width:100%;border-collapse:collapse;}
  .acc-table td{border:none;padding:5px 8px;text-align:right;font-size:12.5px;}
  .acc-table td:last-child{text-align:left;}
  .acc-section-row td{font-size:11px;font-weight:700;color:var(--gold);padding-top:12px;padding-bottom:2px;}
  .acc-label{color:#4b5a62;}
  .acc-val{color:#22303a;}
  .acc-totals-row{border-top:1px solid #f1efe8;}
  .acc-totals-row td{font-weight:700;color:var(--navy);padding-top:8px;}
  .acc-totals-row.grand-item td{color:var(--navy);font-size:13.5px;}
  footer{text-align:center;font-size:11px;color:var(--muted);padding:24px 20px;}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---- Login screen ---- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy) 0%,#241209 100%);padding:20px;}
  .login-card{background:#fff;border-radius:16px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.35);}
  .login-logo{height:64px;display:flex;justify-content:center;margin-bottom:18px;}
  .login-logo img{height:100%;object-fit:contain;}
  .login-card h2{text-align:center;font-size:16px;margin:0 0 4px;color:var(--navy);}
  .login-card p.sub{text-align:center;font-size:12px;color:var(--muted);margin:0 0 22px;}
  .login-field{margin-bottom:14px;}
  .login-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .login-field input{width:100%;border:1px solid var(--border);border-radius:9px;padding:11px 12px;font-size:14px;}
  .login-field input:focus{outline:none;border-color:var(--gold);}
  .login-btn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:9px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;}
  .login-btn:hover{background:var(--navy-2);}
  .login-btn:disabled{opacity:.5;cursor:not-allowed;}
  .login-error{background:#fbecee;border:1px solid #f0c4c9;color:var(--danger);font-size:12.5px;border-radius:8px;padding:9px 12px;margin-bottom:14px;text-align:center;}
  .login-attempts{text-align:center;font-size:11px;color:var(--muted);margin-top:12px;}
  .login-link{display:block;text-align:center;font-size:12px;color:var(--gold);background:none;border:none;cursor:pointer;margin-top:16px;width:100%;}
  .login-link:hover{text-decoration:underline;}

  /* ---- Top app bar (post-login) ---- */
  .topbar{background:var(--navy);color:#fff;}
  .topbar-inner{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .topbar-brand{display:flex;align-items:center;gap:12px;}
  .topbar-logo{height:38px;}
  .topbar-logo img{height:100%;object-fit:contain;}
  .topbar-titles h1{font-size:15px;margin:0;font-weight:700;}
  .topbar-titles p{font-size:11px;margin:2px 0 0;color:#d7c3b3;}
  .icon-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .icon-btn:hover{background:rgba(255,255,255,.16);}
  .breadcrumb-btn{background:none;border:none;color:#d7c3b3;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;padding:6px 4px;}
  .breadcrumb-btn:hover{color:#fff;}

  /* ---- Home: month grid ---- */
  .home-header{max-width:1200px;margin:0 auto;padding:28px 20px 6px;text-align:center;}
  .home-header h2{font-size:20px;margin:0;color:var(--navy);}
  .home-header p{font-size:13px;color:var(--muted);margin:6px 0 0;}
  .month-grid{max-width:1200px;margin:26px auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}
  .month-tile{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px 16px;text-align:center;cursor:pointer;transition:.15s;position:relative;}
  .month-tile:hover{border-color:var(--gold);box-shadow:0 8px 20px rgba(57,32,21,.08);transform:translateY(-2px);}
  .month-tile .m-icon{width:46px;height:46px;border-radius:12px;background:#f3e6da;color:var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-weight:700;font-size:15px;}
  .month-tile.has-data .m-icon{background:var(--gold);color:#fff;}
  .month-tile h3{font-size:14px;margin:0 0 4px;color:var(--navy);font-weight:700;}
  .month-tile p{font-size:11px;color:var(--muted);margin:0;}
  .month-tile .m-badge{position:absolute;top:10px;left:10px;background:var(--success);color:#fff;font-size:9px;padding:2px 7px;border-radius:20px;}

  /* ---- Settings modal ---- */
  .settings-body{padding:4px 0;}
  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);gap:12px;}
  .settings-row:last-child{border-bottom:none;}
  .settings-row label{font-size:13px;color:var(--text);font-weight:600;}
  .settings-row .hint{font-size:11px;color:var(--muted);margin-top:2px;}
  .settings-row input[type=number],.settings-row input[type=password],.settings-row input[type=text]{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;width:140px;text-align:center;}
  .settings-section-title{font-size:12px;font-weight:700;color:var(--gold);margin:18px 0 4px;}

  /* ---- Workspace toolbar / totals row ---- */
  .totals-row{background:#f3e6da;font-weight:700;}
  .totals-row td{border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);color:var(--navy);}
  .totals-row .sticky-col{background:#f3e6da;}

  /* ---- Print / PDF (A4 landscape) ---- */
  #print-area{display:none;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block;position:absolute;top:0;left:0;width:100%;padding:10mm;}
    @page{size:A4 landscape;margin:8mm;}
    .print-title{font-size:16px;font-weight:700;color:#392015;margin-bottom:2px;}
    .print-sub{font-size:11px;color:#666;margin-bottom:14px;}
    .print-table{width:100%;border-collapse:collapse;font-size:10px;}
    .print-table th,.print-table td{border:1px solid #999;padding:4px 6px;text-align:center;}
    .print-table th{background:#f0ebe4;}
    .print-table td:first-child,.print-table th:first-child{text-align:right;}
    .print-grand{background:#f3e6da;font-weight:700;}
  }
</style>

function lineItemTotals(rows) {
  return SUMMARY_LINE_ITEMS.map(item => ({
    ...item,
    total: item.field ? rows.reduce((s, e) => s + (Number(e[item.field]) || 0), 0) : 0,
  }));
}
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

function blankEmployee() {
  const base = { id: uid(), classification: "موظفين", cadre: "201" };
  NUMERIC_KEYS.forEach(k => (base[k] = 0));
  return base;
}
function deriveTotals(emp) {
  const totalAllowances = ALLOWANCE_FIELDS.reduce((s, f) => s + (Number(emp[f.key]) || 0), 0);
  const totalDeductions = DEDUCTION_FIELDS.reduce((s, f) => s + (Number(emp[f.key]) || 0), 0);
  const basic = Number(emp.basicSalary) || 0;
  return { totalAllowances, totalDeductions, net: basic + totalAllowances - totalDeductions };
}
function classificationFor(rawText, rawCadre) {
  const text = (rawText || "").toString().trim();
  const cadre = (rawCadre || "").toString().trim();
  let match = CLASSIFICATIONS.find(c => c.name === text);
  if (!match && cadre) match = CLASSIFICATIONS.find(c => c.cadre === cadre);
  return match || null;
}
function parseWorkbook(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: "array" });
  const sheetName = wb.SheetNames.find(n => n.includes("مسير")) || wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
  let headerRowIdx = -1;
  for (let i = 0; i < Math.min(6, rows.length); i++) {
    if (rows[i].some(cell => String(cell).includes("التصنيف المهني"))) { headerRowIdx = i; break; }
  }
  if (headerRowIdx === -1) throw new Error('ما لقيت عمود "التصنيف المهني" في أول 6 صفوف — تأكد من شكل الملف.');
  const headerRow = rows[headerRowIdx];
  const colIndex = {};
  Object.entries(HEADER_MATCHERS).forEach(([field, kws]) => {
    const idx = headerRow.findIndex(cell => kws.some(kw => String(cell).includes(kw)));
    if (idx !== -1) colIndex[field] = idx;
  });
  if (colIndex.classification === undefined) throw new Error("ما قدرت أحدد عمود التصنيف المهني.");
  const employees = [], unmatched = [];
  for (let r = headerRowIdx + 1; r < rows.length; r++) {
    const row = rows[r];
    const rawClass = row[colIndex.classification];
    if (rawClass === "" || rawClass === undefined) continue;
    const rawCadre = colIndex.cadre !== undefined ? row[colIndex.cadre] : "";
    const match = classificationFor(rawClass, rawCadre);
    const emp = { id: uid(), classification: match ? match.name : String(rawClass).trim(), cadre: match ? match.cadre : String(rawCadre || "").trim() };
    NUMERIC_KEYS.forEach(key => {
      const idx = colIndex[key];
      const v = idx !== undefined ? Number(row[idx]) : 0;
      emp[key] = Number.isFinite(v) ? v : 0;
    });
    employees.push(emp);
    if (!match) unmatched.push(emp.classification);
  }
  return { employees, unmatched: [...new Set(unmatched)] };
}
function exportWorkbook(municipality, employees, summaryRows) {
  const empHeader = ["التصنيف المهني", "الكادر", "الراتب الأساسي", ...ALLOWANCE_FIELDS.map(f => f.label), ...DEDUCTION_FIELDS.map(f => f.label), "إجمالي البدلات", "إجمالي الحسميات", "الصافي"];
  const empRows = employees.map(e => {
    const d = deriveTotals(e);
    return [e.classification, e.cadre, e.basicSalary, ...ALLOWANCE_FIELDS.map(f => e[f.key]), ...DEDUCTION_FIELDS.map(f => e[f.key]), d.totalAllowances, d.totalDeductions, d.net];
  });

  // grand-total pseudo category ("جميع الفئات") mirrors the last block of the original report
  const grandRow = {
    name: "ALL", cadre: "", label: "جميع الفئات", rows: employees,
    ...(() => {
      const t = employees.reduce((acc, e) => {
        const d = deriveTotals(e);
        acc.basic += Number(e.basicSalary) || 0; acc.allowances += d.totalAllowances;
        acc.deductions += d.totalDeductions; acc.net += d.net; return acc;
      }, { basic: 0, allowances: 0, deductions: 0, net: 0 });
      return { count: employees.length, ...t };
    })(),
  };
  const blocksForExport = [...summaryRows, grandRow];

  // ---- "خلاصة المسير" sheet: reproduces the exact original report layout ----
  // Columns: الاجمالي | النوع | رقم الحساب | بدلات/حسميات | اجمالي الصافي |
  //          اجمالي الحسميات | اجمالي البدلات | اجمالي الراتب الاساسي |
  //          عدد الموظفين | الفئة | اسم البند | رقم البند
  const khHeader = [
    "الاجمالي", "النوع", "رقم الحساب", "بدلات/حسميات",
    "اجمالي الصافي", "اجمالي الحسميات", "اجمالي البدلات", "اجمالي الراتب الاساسي",
    "عدد الموظفين", "الفئة", "اسم البند", "رقم البند",
  ];
  const khRows = [];
  blocksForExport.forEach(r => {
    const meta = CATEGORY_META[r.name] || CATEGORY_META.ALL;
    const items = lineItemTotals(r.rows || []);
    let firstAllowanceRow = true, firstDeductionRow = true, firstRowOfBlock = true;

    items.forEach(it => {
      const account = it.label === "فرق الراتب الأساسي" ? meta.basicDiffAccount : it.account;
      const typeMark = it.section === "البدلات" && firstAllowanceRow ? "البدلات"
                      : it.section === "الحسميات" && firstDeductionRow ? "الحسميات" : "";
      if (it.section === "البدلات") firstAllowanceRow = false;
      if (it.section === "الحسميات") firstDeductionRow = false;

      const itemName = it.section === "البدلات" ? meta.allowanceItemName : meta.payrollItemName;
      const itemCode = it.section === "البدلات" ? meta.allowanceItemCode : meta.payrollItemCode;
      const showItemNameCode = it.section === "البدلات" ? typeMark === "البدلات" : it.label === "فرق الراتب الأساسي";

      khRows.push([
        it.total, it.label, account || "", typeMark,
        firstRowOfBlock ? r.net : "",
        firstRowOfBlock ? r.deductions : "",
        firstRowOfBlock ? r.allowances : "",
        firstRowOfBlock ? r.basic : "",
        firstRowOfBlock ? r.count : "",
        firstRowOfBlock ? r.label : "",
        showItemNameCode ? itemName : "",
        showItemNameCode ? itemCode : "",
      ]);
      firstRowOfBlock = false;
    });
    khRows.push(["", "", "", "", "", "", "", "", "", "", "", ""]); // فاصل بين الفئات
  });

  const sumHeader = ["الفئة", "رقم الكادر", "عدد الموظفين", "إجمالي الراتب الأساسي", "إجمالي البدلات", "إجمالي الحسميات", "إجمالي الصافي"];
  const sumRows = blocksForExport.map(r => [r.label, r.cadre || "—", r.count, r.basic, r.allowances, r.deductions, r.net]);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([empHeader, ...empRows]), "بيانات الموظفين");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([khHeader, ...khRows]), "خلاصة المسير");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([sumHeader, ...sumRows]), "ملخص سريع");
  XLSX.writeFile(wb, `خلاصة_${municipality || "بلدية"}.xlsx`);
}
function downloadTemplate() {

  const sample = ["موظفين", "201", 5000, 500, 0, 0, 0, 0, 0, 200, 300, 0, 0, 0, 0];

function Login({ onSuccess }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [attempts, setAttempts] = useState(() => Number(localStorage.getItem(ATTEMPTS_KEY) || 0));
  const [recoveryMode, setRecoveryMode] = useState(false);
  const [recoveryKey, setRecoveryKey] = useState("");
  const [newPass, setNewPass] = useState("");
  const [newPass2, setNewPass2] = useState("");
  const locked = attempts >= MAX_ATTEMPTS;

  function handleSubmit(e) {
    e.preventDefault();
    if (locked) return;
    if (username.trim().toLowerCase() === APP_USERNAME && password === getCurrentPassword()) {
      localStorage.setItem(ATTEMPTS_KEY, "0");
      sessionStorage.setItem("km:authed", "1");
      onSuccess();
    } else {
      const next = attempts + 1;
      setAttempts(next);
      localStorage.setItem(ATTEMPTS_KEY, String(next));
      setError(next >= MAX_ATTEMPTS
        ? 'تجاوزت عدد المحاولات المسموح بها. استخدم "نسيت كلمة المرور؟" بالأسفل.'
        : `اسم المستخدم أو كلمة المرور غير صحيحة (محاولة ${next} من ${MAX_ATTEMPTS})`);
    }
  }

  function handleRecovery(e) {
    e.preventDefault();
    if (recoveryKey.trim() !== RECOVERY_KEY) {
      setError("رمز الاسترداد غير صحيح.");
      return;
    }
    if (!newPass || newPass.length < 6) {
      setError("كلمة المرور الجديدة لازم تكون 6 أحرف على الأقل.");
      return;
    }
    if (newPass !== newPass2) {
      setError("كلمتا المرور غير متطابقتين.");
      return;
    }
    localStorage.setItem(CUSTOM_PASS_KEY, newPass);
    localStorage.setItem(ATTEMPTS_KEY, "0");
    setAttempts(0);
    setRecoveryMode(false);
    setError("");
    setPassword("");
    setRecoveryKey(""); setNewPass(""); setNewPass2("");
    alert("تم تعيين كلمة مرور جديدة بنجاح. سجّل الدخول بكلمة المرور الجديدة.");
  }

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-logo"><img src={LOGO_COLOR} alt="شعار بلدية خميس مشيط" /></div>
        <h2 className="brand-font">ملفات مسيرات الرواتب</h2>
        <p className="sub">بلدية خميس مشيط</p>

        {error && <div className="login-error">{error}</div>}

        {!recoveryMode ? (
          <form onSubmit={handleSubmit}>
            <div className="login-field">
              <label>اسم المستخدم</label>
              <input value={username} onChange={e => setUsername(e.target.value)} disabled={locked} autoFocus />
            </div>
            <div className="login-field">
              <label>كلمة المرور</label>
              <input type="password" value={password} onChange={e => setPassword(e.target.value)} disabled={locked} />
            </div>
            <button className="login-btn" type="submit" disabled={locked}>
              {locked ? "الحساب مقفل مؤقتًا" : "تسجيل الدخول"}
            </button>
            {!locked && attempts > 0 && (
              <p className="login-attempts">المحاولات المتبقية: {MAX_ATTEMPTS - attempts}</p>
            )}
            <button type="button" className="login-link" onClick={() => { setRecoveryMode(true); setError(""); }}>
              نسيت كلمة المرور؟
            </button>
          </form>
        ) : (
          <form onSubmit={handleRecovery}>
            <div className="login-field">
              <label>رمز الاسترداد</label>
              <input value={recoveryKey} onChange={e => setRecoveryKey(e.target.value)} autoFocus />
            </div>
            <div className="login-field">
              <label>كلمة المرور الجديدة</label>
              <input type="password" value={newPass} onChange={e => setNewPass(e.target.value)} />
            </div>
            <div className="login-field">
              <label>تأكيد كلمة المرور الجديدة</label>
              <input type="password" value={newPass2} onChange={e => setNewPass2(e.target.value)} />
            </div>
            <button className="login-btn" type="submit">تعيين كلمة المرور الجديدة</button>
            <button type="button" className="login-link" onClick={() => { setRecoveryMode(false); setError(""); }}>
              رجوع لتسجيل الدخول
            </button>
          </form>
        )}
      </div>
    </div>
  );
}

function MonthWorkspace({ year, monthIdx, onBack }) {
  const [employees, setEmployees] = useState([]);
  const [tab, setTab] = useState("data");
  const [ready, setReady] = useState(false);
  const [saving, setSaving] = useState(false);
  const [lastSaved, setLastSaved] = useState(null);
  const [dirty, setDirty] = useState(false);
  const [importWarning, setImportWarning] = useState(null);
  const [expanded, setExpanded] = useState({});
  const fileInputRef = useRef(null);
  const saveTimer = useRef(null);
  const firstLoad = useRef(true);
  const key = monthKey(year, monthIdx);
  const monthLabel = `${MONTHS_AR[monthIdx]} ${year}`;

  useEffect(() => {
    setEmployees(loadJSON(key, []));
    setReady(true);
    firstLoad.current = true;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [key]);

  useEffect(() => {
    if (!ready) return;
    if (firstLoad.current) { firstLoad.current = false; return; }
    setDirty(true);
    setSaving(true);
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      saveJSON(key, employees);
      setSaving(false); setDirty(false); setLastSaved(new Date());
    }, 500);
    return () => clearTimeout(saveTimer.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [employees]);

  function updateEmployee(id, patch) { setEmployees(prev => prev.map(e => (e.id === id ? { ...e, ...patch } : e))); }
  function setClassification(id, name) {
    const found = CLASSIFICATIONS.find(c => c.name === name);
    updateEmployee(id, { classification: name, cadre: found ? found.cadre : "" });
  }
  function addEmployee() { setEmployees(prev => [...prev, blankEmployee()]); }
  function removeEmployee(id) { setEmployees(prev => prev.filter(e => e.id !== id)); }

  function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setImportWarning(null);
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const { employees: imported, unmatched } = parseWorkbook(reader.result);
        setEmployees(prev => [...prev, ...imported]);
        if (unmatched.length) {
          setImportWarning(`تنبيه: ${unmatched.length} تصنيف ما تعرفت عليه (${unmatched.slice(0, 4).join("، ")}${unmatched.length > 4 ? "..." : ""}) — راجعها يدويًا بالجدول.`);
        }
      } catch (err) {
        setImportWarning(err.message || "صار خطأ أثناء قراءة الملف.");
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = "";
  }

  function totalsFor(rows) {
    return rows.reduce((acc, e) => {
      const d = deriveTotals(e);
      acc.basic += Number(e.basicSalary) || 0; acc.allowances += d.totalAllowances;
      acc.deductions += d.totalDeductions; acc.net += d.net; return acc;
    }, { basic: 0, allowances: 0, deductions: 0, net: 0 });
  }
  const summaryRows = CLASSIFICATIONS.map(cat => {
    const rows = employees.filter(e => e.classification === cat.name);
    return { ...cat, rows, count: rows.length, ...totalsFor(rows) };
  });
  const unclassifiedNames = [...new Set(employees.filter(e => !CLASSIFICATIONS.some(c => c.name === e.classification)).map(e => e.classification))];
  const unclassifiedRows = unclassifiedNames.map(name => {
    const rows = employees.filter(e => e.classification === name);
    return { name, cadre: "", label: `غير مصنف: ${name}`, rows, count: rows.length, ...totalsFor(rows) };
  });
  const allRows = [...summaryRows, ...unclassifiedRows];
  const grandTotal = allRows.reduce((acc, r) => {
    acc.count += r.count; acc.basic += r.basic; acc.allowances += r.allowances;
    acc.deductions += r.deductions; acc.net += r.net; return acc;
  }, { count: 0, basic: 0, allowances: 0, deductions: 0, net: 0 });
  function toggleExpand(k) { setExpanded(prev => ({ ...prev, [k]: !prev[k] })); }

  // إجمالي كل عمود رقمي في جدول البيانات الخام (لصف "الإجمالي" فوق البيانات)
  const columnTotals = {};
  NUMERIC_KEYS.forEach(k => { columnTotals[k] = employees.reduce((s, e) => s + (Number(e[k]) || 0), 0); });

  function handlePrint() {
    window.print();
  }

  const grandRowForExport = {
    name: "ALL", cadre: "", label: "جميع الفئات", rows: employees,
    count: employees.length, ...totalsFor(employees),
  };
  const blocksForExport = [...summaryRows, grandRowForExport];
  const printBlocks = blocksForExport.map(r => ({ row: r, items: lineItemTotals(r.rows || []) }));

  if (!ready) return null;

  return (
    <div>
      <div className="topbar">
        <div className="topbar-inner">
          <div className="topbar-brand">
            <button className="breadcrumb-btn" onClick={onBack}>
              <Icon path={I.chevronRight} size={16} /> الرئيسية
            </button>
          </div>
          <div className="topbar-titles" style={{ textAlign: "center" }}>
            <h1>رواتب الموظفين المدنيين — {monthLabel}</h1>
          </div>
          <div style={{ width: 90 }}></div>
        </div>
      </div>

      <main>
        <div className="toolbar">
          <div className="tabs">
            <button className={"tab" + (tab === "data" ? " active" : "")} onClick={() => setTab("data")}>بيانات الموظفين ({employees.length})</button>
            <button className={"tab" + (tab === "summary" ? " active" : "")} onClick={() => setTab("summary")}>خلاصة المسير</button>
          </div>
          <div className="toolbar-actions">
            <span className="save-status">
              {saving ? <React.Fragment><Icon path={I.loader} size={12} spin /> يحفظ...</React.Fragment>
               : dirty ? "تغييرات غير محفوظة"
               : lastSaved ? <React.Fragment><Icon path={I.check} size={12} style={{ color: "var(--success)" }} /> آخر حفظ {lastSaved.toLocaleTimeString("ar-SA")}</React.Fragment>
               : null}
            </span>
            <button className="btn btn-outline" onClick={downloadTemplate}><Icon path={I.fileDown} size={14} /> تحميل قالب</button>
            <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleFile} style={{ display: "none" }} />
            <button className="btn btn-outline" onClick={() => fileInputRef.current.click()}><Icon path={I.upload} size={14} /> استيراد مسير من صرف</button>
            <button className="btn btn-navy" onClick={addEmployee}><Icon path={I.plus} size={14} /> إضافة موظف</button>
            <button className="btn btn-outline" onClick={handlePrint}><Icon path={I.printer} size={14} /> تصدير PDF</button>
            <button className="btn btn-gold" onClick={() => exportWorkbook(`بلدية_خميس_مشيط_${monthLabel}`, employees, allRows)}><Icon path={I.download} size={14} /> تصدير الخلاصة Excel</button>
          </div>
        </div>

        {importWarning && (
          <div className="banner banner-warn">
            <Icon path={I.alert} size={14} style={{ marginTop: 2, flexShrink: 0 }} />
            <span style={{ flex: 1 }}>{importWarning}</span>
            <button onClick={() => setImportWarning(null)}><Icon path={I.x} size={13} /></button>
          </div>
        )}

        {tab === "summary" ? (
          <div>
            <div className="cards">
              {allRows.filter(r => r.count > 0 || CLASSIFICATIONS.some(c => c.name === r.name)).map(r => (
                <div key={r.name} className="card">
                  <span className="cadre-tag">{r.cadre || "—"}</span>
                  <p className="label">{r.label}</p>
                  <p className="count num">{r.count}</p>
                  <p className="unit">موظف</p>
                  <div className="net-row"><span style={{ color: "var(--muted)" }}>الصافي</span><span className="val num">{fmt(r.net)}</span></div>
                </div>
              ))}
            </div>
            <div className="table-wrap">
              <table>
                <thead><tr>
                  <th style={{ textAlign: "right" }}>الفئة</th><th>الكادر</th><th>العدد</th>
                  <th>الراتب الأساسي</th><th>البدلات</th><th>الحسميات</th><th>الصافي</th>
                </tr></thead>
                <tbody>
                  {allRows.map(r => (
                    <tr key={r.label}>
                      <td style={{ textAlign: "right" }}>{r.label}</td>
                      <td className="num" style={{ color: "var(--muted)" }}>{r.cadre || "—"}</td>
                      <td className="num">{r.count}</td>
                      <td className="num">{fmt(r.basic)}</td>
                      <td className="num">{fmt(r.allowances)}</td>
                      <td className="num">{fmt(r.deductions)}</td>
                      <td className="num" style={{ fontWeight: 700, color: "var(--navy)" }}>{fmt(r.net)}</td>
                    </tr>
                  ))}
                  <tr className="grand">
                    <td style={{ textAlign: "right" }}>جميع الفئات</td>
                    <td>—</td>
                    <td className="num">{grandTotal.count}</td>
                    <td className="num">{fmt(grandTotal.basic)}</td>
                    <td className="num">{fmt(grandTotal.allowances)}</td>
                    <td className="num">{fmt(grandTotal.deductions)}</td>
                    <td className="num">{fmt(grandTotal.net)}</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <h3 className="section-title">تفصيل كل فئة حسب البند — زي صفحة الخلاصة بالإكسل</h3>
            <div className="accordion">
              {allRows.filter(r => r.count > 0 || CLASSIFICATIONS.some(c => c.name === r.name)).map(r => {
                const k = r.name || r.label;
                const isOpen = !!expanded[k];
                const items = lineItemTotals(r.rows || []);
                let lastSection = null;
                return (
                  <div className="acc-item" key={k}>
                    <button className="acc-header" onClick={() => toggleExpand(k)}>
                      <span className={"acc-chevron" + (isOpen ? " open" : "")}><Icon path={I.chevronDown} size={15} /></span>
                      <span className="acc-title">{r.label}</span>
                      <span className="acc-cadre num">كادر {r.cadre || "—"}</span>
                      <span className="acc-mini">عدد: <b className="num">{r.count}</b></span>
                      <span className="acc-mini">الصافي: <b className="num">{fmt(r.net)}</b></span>
                    </button>
                    {isOpen && (
                      <div className="acc-body">
                        <table className="acc-table">
                          <tbody>
                            {items.map((it, idx) => {
                              const showSection = it.section !== lastSection;
                              lastSection = it.section;
                              return (
                                <React.Fragment key={idx}>
                                  {showSection && (<tr className="acc-section-row"><td colSpan={2}>{it.section}</td></tr>)}
                                  <tr><td className="acc-label">{it.label}</td><td className="acc-val num">{fmt(it.total)}</td></tr>
                                </React.Fragment>
                              );
                            })}
                            <tr className="acc-totals-row"><td>إجمالي الراتب الأساسي</td><td className="num">{fmt(r.basic)}</td></tr>
                            <tr className="acc-totals-row"><td>إجمالي البدلات</td><td className="num">{fmt(r.allowances)}</td></tr>
                            <tr className="acc-totals-row"><td>إجمالي الحسميات</td><td className="num">{fmt(r.deductions)}</td></tr>
                            <tr className="acc-totals-row grand-item"><td>إجمالي الصافي</td><td className="num">{fmt(r.net)}</td></tr>
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        ) : (
          <div className="table-wrap">
            {employees.length === 0 ? (
              <div className="empty">
                <Icon path={I.sheet} size={30} />
                <p style={{ fontSize: 13, marginTop: 8 }}>لا يوجد موظفين بعد — استورد مسير من منصة صرف أو أضف موظف يدويًا</p>
              </div>
            ) : (
              <table style={{ minWidth: 1400 }}>
                <thead><tr>
                  <th className="sticky-col" style={{ textAlign: "right", minWidth: 150 }}>التصنيف</th>
                  <th>الكادر</th><th>الراتب الأساسي</th>
                  {ALLOWANCE_FIELDS.map(f => <th key={f.key}>{f.label}</th>)}
                  {DEDUCTION_FIELDS.map(f => <th key={f.key}>{f.label}</th>)}
                  <th>الصافي</th><th></th>
                </tr></thead>
                <tbody>
                  <tr className="totals-row">
                    <td className="sticky-col" style={{ textAlign: "right" }}>الإجمالي</td>
                    <td>—</td>
                    <td className="num">{fmt(columnTotals.basicSalary)}</td>
                    {ALLOWANCE_FIELDS.map(f => <td key={f.key} className="num">{fmt(columnTotals[f.key])}</td>)}
                    {DEDUCTION_FIELDS.map(f => <td key={f.key} className="num">{fmt(columnTotals[f.key])}</td>)}
                    <td className="num">{fmt(grandTotal.net)}</td>
                    <td></td>
                  </tr>
                  {employees.map(emp => {
                    const d = deriveTotals(emp);
                    return (
                      <tr key={emp.id}>
                        <td className="sticky-col">
                          <select className="cell-select" value={emp.classification} onChange={e => setClassification(emp.id, e.target.value)}>
                            {CLASSIFICATIONS.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
                            {!CLASSIFICATIONS.some(c => c.name === emp.classification) && <option value={emp.classification}>{emp.classification} (غير معروف)</option>}
                          </select>
                        </td>
                        <td className="num" style={{ color: "var(--muted)" }}>{emp.cadre || "—"}</td>
                        <td><input type="number" className="cell-input num" value={emp.basicSalary} onChange={e => updateEmployee(emp.id, { basicSalary: e.target.value })} /></td>
                        {ALLOWANCE_FIELDS.map(f => (
                          <td key={f.key}><input type="number" className="cell-input num" value={emp[f.key]} onChange={e => updateEmployee(emp.id, { [f.key]: e.target.value })} /></td>
                        ))}
                        {DEDUCTION_FIELDS.map(f => (
                          <td key={f.key}><input type="number" className="cell-input num" value={emp[f.key]} onChange={e => updateEmployee(emp.id, { [f.key]: e.target.value })} /></td>
                        ))}
                        <td className="num" style={{ fontWeight: 700, color: "var(--navy)" }}>{fmt(d.net)}</td>
                        <td><button className="del-btn" onClick={() => removeEmployee(emp.id)}><Icon path={I.trash} size={14} /></button></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}
          </div>
        )}
      </main>

      {/* منطقة الطباعة (PDF) — تظهر فقط عند الطباعة، A4 بالعرض */}
      <div id="print-area">
        <div className="print-title">خلاصة المسير — بلدية خميس مشيط</div>
        <div className="print-sub">رواتب الموظفين المدنيين — {monthLabel}</div>
        <table className="print-table">
          <thead><tr>
            <th>الفئة</th><th>الكادر</th><th>البند</th><th>الإجمالي</th>
          </tr></thead>
          <tbody>
            {printBlocks.map(({ row, items }) => (
              <React.Fragment key={row.name || row.label}>
                {items.map((it, idx) => (
                  <tr key={idx}>
                    {idx === 0 && <td rowSpan={items.length + 1}>{row.label}</td>}
                    {idx === 0 && <td rowSpan={items.length + 1} className="num">{row.cadre || "—"}</td>}
                    <td>{it.label}</td>
                    <td className="num">{fmt(it.total)}</td>
                  </tr>
                ))}
                <tr className="print-grand">
                  <td>إجمالي الصافي ({row.count} موظف)</td>
                  <td className="num">{fmt(row.net)}</td>
                </tr>
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ----------------------------------------------------------------------------
// التطبيق الرئيسي
// ----------------------------------------------------------------------------
function App() {
  const [authed, setAuthed] = useState(() => sessionStorage.getItem("km:authed") === "1");
  const [settings, setSettings] = useState(() => loadJSON(SETTINGS_KEY, { year: 2026 }));
  const [screen, setScreen] = useState("home"); // 'home' | 'month'
  const [activeMonth, setActiveMonth] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [monthsWithData, setMonthsWithData] = useState(() => new Set());

  useEffect(() => {
    if (!authed) return;
    const found = new Set();
    for (let i = 0; i < 12; i++) {
      const list = loadJSON(monthKey(settings.year, i), []);
      if (list && list.length > 0) found.add(i);
    }
    setMonthsWithData(found);
  }, [authed, settings.year, screen]);

  function handleSaveSettings(next) {
    setSettings(next);
    saveJSON(SETTINGS_KEY, next);
    setShowSettings(false);
  }
  function handleLogout() {
    sessionStorage.removeItem("km:authed");
    setAuthed(false);
  }

  if (!authed) return <Login onSuccess={() => setAuthed(true)} />;

  return (
    <React.Fragment>
      {screen === "home" && (
        <Home
          settings={settings}
          monthsWithData={monthsWithData}
          onOpenMonth={(idx) => { setActiveMonth(idx); setScreen("month"); }}
          onOpenSettings={() => setShowSettings(true)}
          onLogout={handleLogout}
        />
      )}
      {screen === "month" && (
        <MonthWorkspace year={settings.year} monthIdx={activeMonth} onBack={() => setScreen("home")} />
      )}
      {showSettings && (
        <SettingsModal settings={settings} onSave={handleSaveSettings} onClose={() => setShowSettings(false)} />
      )}
      <footer>بلدية خميس مشيط — نظام داخلي لإدارة مسيرات الرواتب الشهرية</footer>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
